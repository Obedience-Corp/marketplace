name: Metadata

on:
  pull_request:
    paths: &metadata_paths
      - "packages/**"
      - "obey-marketplace.json"
      - "index.json"
      - "tools/metadata/**"
      - ".github/workflows/metadata.yml"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
    paths: *metadata_paths

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
      - name: Verify package metadata signatures
        run: go run ./tools/metadata verify
      - name: Test metadata tooling
        if: github.event_name == 'pull_request'
        run: go test ./tools/metadata
