name: Sign metadata

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    # Never let a fork pull request reach the signing secret: this key is the
    # entire trust root pinned into the hub binary
    # (festival-installer/internal/verify/trust.go:12-14), and a fork must
    # never reach it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout@v4 checks out a merge commit in detached HEAD
          # for pull_request events. Attach to the real branch instead, so
          # the push below has somewhere to push onto.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
      - name: Sign canonical package metadata
        env:
          FESTIVAL_METADATA_SIGNING_KEY: ${{ secrets.FESTIVAL_METADATA_SIGNING_KEY }}
        run: go run ./tools/metadata sign
      - name: Verify signatures
        run: go run ./tools/metadata verify
      - name: Commit and push signatures
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          PATHS="packages obey-marketplace.json obey-marketplace.json.sig index.json index.json.sig"
          # Load-bearing for termination, not just tidy: signing a pull
          # request branch pushes to it, which re-triggers this workflow via
          # pull_request: synchronize. That re-run reaches this same check
          # on a tree that is already canonical and signed and exits here
          # before any second push, which is what stops the loop.
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "Metadata is already signed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git -c commit.gpgsign=false commit -m "Sign marketplace metadata"
          # Push straight to the branch, including main: the organization
          # forbids GITHUB_TOKEN from creating or approving pull requests
          # (repos/Obedience-Corp/marketplace/actions/permissions/workflow
          # returns 409 on that setting), so a push-a-branch-and-open-a-PR
          # step can never succeed here. Obedience-Corp/marketplace has no
          # branch protection on main today (verified via the branches/main
          # /protection API, 404 "Branch not protected"), so pushing
          # directly is safe. If main ever gets branch protection, this step
          # needs to push a metadata-sign-<run id> branch and print a
          # compare URL in the job summary instead.
          git push origin "HEAD:${BRANCH}"
