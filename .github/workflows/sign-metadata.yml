name: Sign metadata

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
      - name: Sign canonical package metadata
        env:
          FESTIVAL_METADATA_SIGNING_KEY: ${{ secrets.FESTIVAL_METADATA_SIGNING_KEY }}
        run: go run ./tools/metadata sign
      - name: Verify signatures
        run: go run ./tools/metadata verify
      - name: Open signed metadata pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_BRANCH: metadata-sign-${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain -- packages)" ]; then
            echo "Metadata is already signed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SIGN_BRANCH"
          git add packages
          git commit -m "Sign marketplace metadata"
          git push origin "$SIGN_BRANCH"
          gh pr create \
            --base main \
            --head "$SIGN_BRANCH" \
            --title "Sign marketplace metadata" \
            --body "Canonicalizes and signs official package metadata with the protected repository key."
